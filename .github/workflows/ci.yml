name: ci

# Every push and pull request: the Python test suite (models, leakage, pipeline end to end, API) and the web
# app (type check, build, headless-Chrome smoke test with external requests blocked).
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[data,ml,dev,api]"
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mvp/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mvp/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Smoke test (headless Chrome, offline)
        run: |
          npx vite preview --port 4173 --strictPort --host 127.0.0.1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          BASE=http://127.0.0.1:4173 CHROME=$(which google-chrome) npm run smoke
