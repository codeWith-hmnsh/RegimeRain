name: pages

# Publishes the web app to GitHub Pages: https://<user>.github.io/RegimeRain/
# One-time setup (done 4 Nov 2026): repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The site is static: it reads the run folders published into mvp/web/public/run/ (`regimerain run --publish`).
on:
  push:
    branches: [main]
    paths: ["mvp/web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mvp/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mvp/web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Deep links (/forecast, /scorecard ...) load the app instead of a 404 page
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mvp/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
